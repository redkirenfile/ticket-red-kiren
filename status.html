<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>🎫 ตรวจสอบสถานะบัตร — แฟ้มคดีกิเลนแดง : สังหารหมู่เขาศูนย์ (Red Kiren File)</title>
  <meta name="description" content="ตรวจสอบสถานะบัตรและ QR Code ของคุณสำหรับการแสดง AFTER 6 มรดก 6 ตุลา" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="assets/qrcodejs.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0d;
      --surface-card: #0c0c10;
      --surface-inner: #050507;
      --border: rgba(255, 255, 255, 0.1);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.22);
      --purple: #ff3b30;
      --purple-light: #ff5247;
      --gold: #ffffff;
      --gold-light: #f4f4f5;
      --success: #22c55e;
      --error: #ef4444;
      --text: #ffffff;
      --text-secondary: #d4d4d8;
      --muted: #8e8e93;
      --radius: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.05) 0%, transparent 60%);
      background-repeat: no-repeat;
    }

    /* ── HEADER ── */
    .status-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-logo {
      font-size: 1rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .logo-emoji {
      -webkit-text-fill-color: initial !important;
      background: none !important;
      background-clip: initial !important;
      -webkit-background-clip: initial !important;
      display: inline-block;
    }
    .logo-text {
      color: #ffffff;
      display: inline-block;
      letter-spacing: 0.2px;
    }
    .logo-short { display: none; }
    .header-nav a {
      color: var(--text-secondary); font-size: 0.85rem; text-decoration: none;
      padding: 6px 14px; border: 1px solid var(--border); border-radius: 50px;
      background: #0c0c10;
      transition: var(--transition);
    }
    .header-nav a:hover { color: #ffffff; border-color: var(--border-hover); background: #16161e; }

    @media (max-width: 600px) {
      .status-header { padding: 10px 10px; }
      .header-logo { font-size: 0.9rem; }
      .logo-full { display: none; }
      .logo-short { display: inline; }
      .header-nav a { font-size: 0.75rem; padding: 4px 10px; }
    }

    /* ── MAIN ── */
    .status-main { max-width: 600px; margin: 0 auto; padding: 32px 16px 80px; }

    /* ── HERO ── */
    .status-hero { text-align: center; margin-bottom: 32px; }
    .status-hero-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .status-hero h1 { font-size: 1.6rem; font-weight: 700; color: #ffffff; margin-bottom: 8px; letter-spacing: 0.5px; }
    .status-hero p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }

    /* ── SEARCH BOX ── */
    .search-card {
      background: #09090c; border: 1px solid var(--border);
      border-radius: 20px; padding: 24px; backdrop-filter: blur(10px);
      margin-bottom: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }
    .search-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--muted); margin-bottom: 16px; }
    .search-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .search-tab {
      flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
      background: #000000; color: var(--muted); font-family: inherit;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: var(--transition);
    }
    .search-tab.active {
      background: #121216; border-color: var(--purple); color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 59, 48, 0.18);
    }
    .search-input-wrap { position: relative; }
    .search-input-wrap input {
      width: 100%; background: #000000; border: 1.5px solid var(--border);
      border-radius: 12px; padding: 13px 16px; color: #ffffff;
      font-family: inherit; font-size: 1rem; outline: none; transition: var(--transition);
    }
    .search-input-wrap input:focus { border-color: var(--purple-light); box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.18); }
    .search-input-wrap input::placeholder { color: #52525b; }
    .btn-search {
      width: 100%; margin-top: 14px;
      background: #ff3b30;
      color: #ffffff; border: none; border-radius: 12px;
      padding: 13px; font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 20px rgba(255, 59, 48, 0.28);
    }
    .btn-search:hover { transform: translateY(-1px); background: #ff5247; box-shadow: 0 8px 26px rgba(255, 59, 48, 0.42); }
    .btn-search:active { transform: scale(0.98); }

    /* ── RESULT SECTION ── */
    #result-section { display: none; animation: fadeUp 0.35s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

    /* ── ORDER CARD (collapsed) ── */
    .order-card {
      background: #09090c;
      border: 1px solid var(--border);
      border-radius: 20px;
      margin-bottom: 16px;
      overflow: hidden;
      transition: var(--transition);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.8);
    }
    .order-card:hover { border-color: var(--border-hover); }

    .order-card-header {
      padding: 20px;
      cursor: default;
    }

    .order-card-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      margin-bottom: 14px;
    }
    .order-card-id {
      font-family: monospace; font-size: 0.78rem;
      background: #141418; color: var(--purple-light);
      padding: 4px 10px; border-radius: 6px; letter-spacing: 0.5px;
      border: 1px solid var(--border-subtle);
    }
    .order-card-date {
      font-size: 0.75rem; color: var(--muted); margin-top: 4px;
    }
    .order-ticket-count {
      display: inline-flex; align-items: center; gap: 4px;
      background: #141418; border: 1px solid var(--border);
      color: #ffffff; border-radius: 50px;
      font-size: 0.78rem; font-weight: 700; padding: 4px 12px;
      white-space: nowrap; flex-shrink: 0;
    }

    .order-card-rows {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    }
    .order-info-item { font-size: 0.82rem; }
    .order-info-item .oi-label { color: var(--muted); font-size: 0.72rem; margin-bottom: 2px; }
    .order-info-item .oi-val { font-weight: 600; color: #ffffff; }

    .order-card-footer {
      padding: 0 20px 18px;
    }

    /* Expand button */
    .btn-expand-tickets {
      width: 100%;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-family: inherit; font-size: 0.9rem; font-weight: 700;
      padding: 12px 16px;
      cursor: pointer;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-expand-tickets:hover {
      background: #1a1a22;
      border-color: var(--border-hover);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-expand-tickets .expand-arrow {
      transition: transform 0.3s ease;
      display: inline-block;
    }
    .btn-expand-tickets.open .expand-arrow { transform: rotate(180deg); }

    /* ── TICKETS PANEL (expandable) ── */
    .tickets-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .tickets-panel.open { max-height: 9999px; }
    .tickets-panel-inner { padding: 0 16px 16px; }

    .tickets-panel-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--muted);
      margin-bottom: 10px; padding-top: 4px;
    }

    /* ── INDIVIDUAL TICKET CARD ── */
    .ticket-status-card {
      background: #000000; border: 1px solid var(--border-subtle);
      border-radius: 14px; overflow: hidden; margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .ticket-status-card:last-child { margin-bottom: 0; }

    .ticket-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border-subtle);
      background: #0d0d11;
    }
    .ticket-num-label { font-size: 0.78rem; color: var(--muted); }
    .ticket-id-code { font-family: monospace; font-size: 0.72rem; color: var(--purple-light); margin-top: 2px; }

    .ticket-status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px; border-radius: 50px; font-size: 0.73rem; font-weight: 700;
      white-space: nowrap;
    }
    .badge-checked   { background: rgba(34,197,94,0.12);  color: #86efac;   border: 1px solid rgba(34,197,94,0.25); }
    .badge-pending   { background: rgba(255,255,255,0.06); color: #f4f4f5; border: 1px solid rgba(255,255,255,0.12); }
    .badge-cancelled { background: rgba(239,68,68,0.12);    color: #fca5a5;   border: 1px solid rgba(239,68,68,0.25); }

    .ticket-card-body { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: #050507; }
    .qr-wrap {
      background: #ffffff !important;
      border-radius: 12px;
      padding: 14px !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      filter: none !important;
      color-scheme: light !important;
    }
    .qr-wrap canvas,
    .qr-wrap img {
      vertical-align: middle;
      background: #ffffff !important;
      filter: none !important;
      color-scheme: light !important;
    }
    .ticket-detail-rows { width: 100%; }
    .ticket-info-row { display: flex; justify-content: space-between;
      font-size: 0.82rem; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .ticket-info-row:last-child { border-bottom: none; }
    .ticket-info-row .tl { color: var(--muted); }
    .ticket-info-row .tv { font-weight: 500; text-align: right; color: #ffffff; }

    .btn-download-qr {
      width: 100%; background: #121216; border: 1px solid var(--border);
      color: #ffffff; border-radius: 10px; padding: 10px;
      font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-download-qr:hover { background: #ff3b30; border-color: #ff3b30; color: #ffffff; }

    .btn-regen-qr {
      background: #000000 !important;
      border: 1px solid var(--border) !important;
      color: var(--muted) !important;
    }
    .btn-regen-qr:hover {
      background: #141418 !important;
      border-color: var(--border-hover) !important;
      color: #ffffff !important;
    }

    /* ── NOT FOUND ── */
    .not-found {
      text-align: center; padding: 48px 24px;
      background: #09090c; border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .not-found .nf-icon { font-size: 3rem; margin-bottom: 12px; }
    .not-found h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: #fca5a5; }
    .not-found p { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }

    /* ── NOTE ── */
    .status-note {
      background: #09090c; border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 18px; font-size: 0.82rem; color: var(--muted);
      line-height: 1.6; display: flex; gap: 10px; align-items: flex-start; margin-top: 20px;
    }

    /* ── ERROR ── */
    .error-msg { color: #fca5a5; font-size: 0.85rem; margin-top: 8px; display: none; }
    .error-msg.show { display: block; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(10, 10, 14, 0.96); border: 1px solid var(--border);
      color: var(--text); padding: 12px 24px; border-radius: 50px; font-size: 0.85rem;
      font-weight: 500; z-index: 9999; backdrop-filter: blur(20px);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s; opacity: 0;
      box-shadow: 0 12px 36px rgba(0,0,0,0.8); white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(34,197,94,0.4); }
    .toast.error { border-color: rgba(239,68,68,0.4); }

    /* ── FOOTER ── */
    .status-footer { text-align: center; padding: 20px; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>

<header class="status-header">
  <div class="header-logo">
    <span class="logo-emoji">🎭</span>
    <span class="logo-text logo-full">แฟ้มคดีกิเลนแดง : สังหารหมู่เขาศูนย์</span>
    <span class="logo-text logo-short">RED KIREN FILE</span>
  </div>
  <nav class="header-nav">
    <a href="index.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 50px; text-decoration: none; color: var(--text); background: var(--surface); transition: var(--transition); font-size: 0.85rem;">
      🏠 กลับหน้าหลัก
    </a>
  </nav>
</header>

<main class="status-main">

  <!-- HERO -->
  <div class="status-hero">
    <div class="status-hero-icon">🎫</div>
    <h1>ตรวจสอบสถานะบัตร</h1>
    <p>กรอกเบอร์โทรศัพท์หรือรหัสคำสั่งซื้อ<br/>เพื่อดูรายการสั่งซื้อและ QR Code บัตรของคุณ</p>
  </div>

  <!-- SEARCH -->
  <div class="search-card">
    <div class="search-title">🔍 ค้นหาบัตรของคุณ</div>
    <div class="search-tabs">
      <button class="search-tab active" id="tab-phone" onclick="switchTab('phone')">📞 เบอร์โทรศัพท์</button>
      <button class="search-tab" id="tab-order" onclick="switchTab('order')">📋 รหัสคำสั่งซื้อ</button>
    </div>
    <div class="search-input-wrap">
      <input type="tel" id="input-phone" placeholder="กรอกเบอร์โทรศัพท์"
             inputmode="numeric" onkeydown="if(event.key==='Enter') doSearch()" />
      <input type="text" id="input-order" placeholder="กรอกรหัสการจอง"
             style="display:none;text-transform:uppercase"
             onkeydown="if(event.key==='Enter') doSearch()" />
    </div>
    <div class="error-msg" id="error-msg">❌ กรุณากรอกข้อมูลให้ถูกต้อง</div>
    <button class="btn-search" onclick="doSearch()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      ค้นหาบัตร
    </button>
  </div>

  <!-- RESULT -->
  <div id="result-section"></div>

</main>

<footer class="status-footer">
  © 2026 Red Kiren File. All rights reserved.
</footer>

<script>
// ⚠️ ใส่ URL ของ Google Apps Script ของคุณที่นี่ (ตรงกับใน app.js และ staff.html)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZYQLm5WLNKL4NqGXXRPQFHaldQTCMwb5oaENmMqGHVGC4Aqcy87JnR2oyX9MZtwCECw/exec';

let currentTab = 'phone';

/* ── TAB SWITCH ── */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-phone').classList.toggle('active', tab === 'phone');
  document.getElementById('tab-order').classList.toggle('active', tab === 'order');
  document.getElementById('input-phone').style.display = tab === 'phone' ? 'block' : 'none';
  document.getElementById('input-order').style.display = tab === 'order' ? 'block' : 'none';
  document.getElementById('error-msg').classList.remove('show');
  document.getElementById('result-section').style.display = 'none';
  setTimeout(() => (tab === 'phone'
    ? document.getElementById('input-phone')
    : document.getElementById('input-order')).focus(), 50);
}

/* ── SEARCH ── */
async function doSearch() {
  const errEl = document.getElementById('error-msg');
  errEl.classList.remove('show');

  let query = '';
  if (currentTab === 'phone') {
    const rawVal = document.getElementById('input-phone').value.trim();
    query = cleanThaiPhone(rawVal);
    if (!query || !/^0\d{8,9}$/.test(query)) {
      errEl.textContent = '❌ กรุณากรอกเบอร์โทรศัพท์ที่ถูกต้อง (เช่น 0812345678)';
      errEl.classList.add('show'); return;
    }
  } else {
    query = document.getElementById('input-order').value.trim().toUpperCase();
    if (!query) {
      errEl.textContent = '❌ กรุณากรอกรหัสคำสั่งซื้อ';
      errEl.classList.add('show'); return;
    }
  }

  const resultEl = document.getElementById('result-section');
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div style="text-align:center; padding:48px 24px; background:var(--surface); border:1px solid var(--border); border-radius:16px;">
      <div style="font-size:2.5rem; margin-bottom:12px; animation: spin 1.5s linear infinite;">⏳</div>
      <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:8px;">กำลังค้นหาตั๋วของคุณ...</h3>
      <p style="font-size:0.85rem; color:var(--muted);">โปรดรอสักครู่ ระบบกำลังค้นหาข้อมูลความปลอดภัยบนคลาวด์</p>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  `;

  let allTickets = JSON.parse(localStorage.getItem('theater_tickets') || '{}');
  let allOrders  = JSON.parse(localStorage.getItem('theater_orders')  || '[]');

  // ฟังก์ชันล้างฟอร์แมตเบอร์โทรศัพท์ (ตัด 66 แทนที่ด้วย 0, เติม 0 ให้ครบหลักอัตโนมัติ)
  function cleanThaiPhone(p) {
    let s = String(p || '').trim().replace(/\D/g, '');
    if (s.startsWith('66')) {
      s = '0' + s.substring(2);
    }
    if ((s.length === 8 || s.length === 9) && !s.startsWith('0')) {
      s = '0' + s;
    }
    return s;
  }

  // ฟังก์ชันสแกนหาใน localStorage ท้องถิ่น (ค้นหาทั้ง Orders และ Tickets)
  function findLocalMatchedIds() {
    const ids = new Set();
    if (currentTab === 'phone') {
      const qClean = cleanThaiPhone(query);
      allOrders.forEach(o => {
        const pClean = cleanThaiPhone(o.phone);
        if (pClean && (pClean === qClean || (qClean.length >= 9 && pClean.endsWith(qClean.slice(-9))))) {
          ids.add(o.orderId);
        }
      });
      Object.values(allTickets).forEach(t => {
        const pClean = cleanThaiPhone(t.phone);
        if (pClean && (pClean === qClean || (qClean.length >= 9 && pClean.endsWith(qClean.slice(-9))))) {
          ids.add(t.orderId);
        }
      });
    } else {
      allOrders.forEach(o => {
        if ((o.orderId || '').toUpperCase().includes(query)) ids.add(o.orderId);
      });
      Object.values(allTickets).forEach(t => {
        if ((t.orderId || '').toUpperCase().includes(query) || (t.ticketId || '').toUpperCase().includes(query)) {
          ids.add(t.orderId);
        }
      });
    }
    return ids;
  }

  let matchedOrderIds = new Set();
  let cloudSearched = false;

  // พยายามดึงข้อมูลจาก Sheets แบบ Real-time ตลอดเวลาหากมีการเชื่อมต่อคลาวด์ เพื่อความสอดคล้องสูงสุดข้ามอุปกรณ์
  if (typeof APPS_SCRIPT_URL !== 'undefined' && APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=searchOrder&query=${encodeURIComponent(query)}&type=${currentTab}`);
      if (res.ok) {
        const data = await res.json();
        if (data.success) {
          cloudSearched = true;
          if (data.orders && data.orders.length > 0) {
            // บันทึกแคชตั๋วรายใบ
            Object.assign(allTickets, data.tickets);
            localStorage.setItem('theater_tickets', JSON.stringify(allTickets));

            // บันทึกแคชคำสั่งซื้อ
            data.orders.forEach(newO => {
              const idx = allOrders.findIndex(o => o.orderId === newO.orderId);
              if (idx >= 0) allOrders[idx] = newO;
              else allOrders.push(newO);
            });
            localStorage.setItem('theater_orders', JSON.stringify(allOrders));

            matchedOrderIds = new Set(data.orders.map(o => o.orderId));
          } else {
            // บน Google Sheets ไม่พบข้อมูลนี้แล้ว (ถูกลบออกแล้ว)
            matchedOrderIds = new Set();
          }
        }
      }
    } catch (e) {
      console.warn('ดึงข้อมูลตั๋วผ่านคลาวด์ Sheets ไม่สำเร็จ (กำลังใช้ข้อมูลในเครื่องแทน):', e);
    }
  }

  // หากออฟไลน์หรือไม่สามารถติดต่อคลาวด์ได้ ให้ค้นหาในแคชเครื่องแทน
  if (!cloudSearched) {
    matchedOrderIds = findLocalMatchedIds();
  }

  if (matchedOrderIds.size === 0) {
    resultEl.innerHTML = `
      <div class="not-found">
        <div class="nf-icon">🔍</div>
        <h3>ไม่พบข้อมูลบัตร</h3>
        <p>ไม่พบบัตรที่ตรงกับข้อมูลที่กรอกในระบบ<br/>
        กรุณาตรวจสอบเบอร์โทรศัพท์/รหัสสั่งซื้ออีกครั้ง<br/>
        หรือหากโอนเงินแล้ว กรุณาติดต่อทีมงานเพื่อตรวจสอบครับ</p>
      </div>`;
    return;
  }

  // Sort orders newest first
  const sortedOrderIds = [...matchedOrderIds].sort((a, b) => {
    const tA = allOrders.find(o => o.orderId === a)?.timestamp || '';
    const tB = allOrders.find(o => o.orderId === b)?.timestamp || '';
    return tB.localeCompare(tA);
  });

  // Count results label
  const countLabel = sortedOrderIds.length === 1
    ? 'พบ 1 รายการสั่งซื้อ'
    : `พบ ${sortedOrderIds.length} รายการสั่งซื้อ`;

  let html = `<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px;">${countLabel}</div>`;

  sortedOrderIds.forEach((orderId, orderIdx) => {
    const order = allOrders.find(o => o.orderId === orderId);
    const orderTickets = Object.values(allTickets)
      .filter(t => t.orderId === orderId)
      .sort((a, b) => a.ticketNum - b.ticketNum);

    if (!orderTickets.length) return;
    const rep = orderTickets[0];

    const totalAmt = rep.pricePerTicket
      ? rep.pricePerTicket * orderTickets.length
      : (order?.total || 0);

    const tsLabel = order?.timestamp
      ? new Date(order.timestamp).toLocaleDateString('th-TH', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        })
      : '—';

    // Check-in status summary
    const checkedCount   = orderTickets.filter(t => t.checkedIn && !t.cancelled).length;
    const cancelledCount = orderTickets.filter(t => t.cancelled).length;
    const pendingCount   = orderTickets.length - checkedCount - cancelledCount;

    // Build inner ticket cards HTML (hidden initially)
    let ticketsHtml = '';
    orderTickets.forEach((ticket, idx) => {
      const isCancelled = !!ticket.cancelled;
      const isChecked   = !!ticket.checkedIn && !isCancelled;
      let badgeClass, badgeText;
      if (isCancelled)    { badgeClass = 'badge-cancelled'; badgeText = '🚫 ยกเลิกแล้ว'; }
      else if (isChecked) { badgeClass = 'badge-checked';   badgeText = '✅ เข้างานแล้ว'; }
      else                { badgeClass = 'badge-pending';   badgeText = '⏳ ยังไม่ได้ใช้'; }

      const checkTimeStr = ticket.checkInTime
        ? new Date(ticket.checkInTime).toLocaleString('th-TH', {
            timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit',
            day: '2-digit', month: 'short'
          })
        : '';

      ticketsHtml += `
        <div class="ticket-status-card" id="tsc-${orderId}-${idx}">
          <div class="ticket-card-header">
            <div>
              <div class="ticket-num-label">ใบที่ ${ticket.ticketNum} / ${orderTickets.length}</div>
              <div class="ticket-id-code">${esc(ticket.ticketId)}</div>
            </div>
            <span class="ticket-status-badge ${badgeClass}">${badgeText}${checkTimeStr ? ' · ' + checkTimeStr : ''}</span>
          </div>
          <div class="ticket-card-body">
            ${isCancelled
              ? `<div style="color:#fca5a5;font-size:0.9rem;text-align:center">บัตรใบนี้ถูกยกเลิกโดยทีมงาน<br/>กรุณาติดต่อเจ้าหน้าที่</div>`
              : `<div class="qr-wrap" id="qr-status-${ticket.ticketId}"></div>
                 <div class="ticket-detail-rows">
                   <div class="ticket-info-row"><span class="tl">การแสดง</span><span class="tv">${esc(ticket.show || 'แฟ้มคดีกิเลนแดง : สังหารหมู่เขาศูนย์')}</span></div>
                   <div class="ticket-info-row"><span class="tl">รอบแสดง</span><span class="tv">${esc(ticket.showDate || '—')}</span></div>
                   <div class="ticket-info-row"><span class="tl">ประเภทบัตร</span><span class="tv">${esc(ticket.type || '—')}</span></div>
                   <div class="ticket-info-row"><span class="tl">ผู้ถือบัตร</span><span class="tv">${esc(ticket.name || '—')}</span></div>
                 </div>
                  <button class="btn-download-qr" onclick="downloadQR('${esc(ticket.ticketId)}')">📥 ดาวน์โหลด QR Code</button>
                  <button class="btn-download-qr btn-regen-qr" style="margin-top:6px;" onclick="regenerateSingleQR('${esc(ticket.ticketId)}')">🔄 เจน QR Code อีกครั้ง</button>`
            }
          </div>
        </div>`;
    });

    // Status summary pills
    let statusPills = '';
    if (checkedCount)   statusPills += `<span class="badge-checked ticket-status-badge" style="font-size:0.7rem;padding:2px 8px;">✅ เข้างานแล้ว ${checkedCount}</span> `;
    if (pendingCount)   statusPills += `<span class="badge-pending ticket-status-badge" style="font-size:0.7rem;padding:2px 8px;">⏳ ยังไม่ได้ใช้ ${pendingCount}</span> `;
    if (cancelledCount) statusPills += `<span class="badge-cancelled ticket-status-badge" style="font-size:0.7rem;padding:2px 8px;">🚫 ยกเลิก ${cancelledCount}</span> `;

    html += `
      <div class="order-card" id="order-card-${orderIdx}">

        <!-- Order summary (always visible) -->
        <div class="order-card-header">
          <div class="order-card-top">
            <div>
              <div class="order-card-id">${esc(orderId)}</div>
              <div class="order-card-date">จองเมื่อ ${tsLabel}</div>
            </div>
            <div class="order-ticket-count">🎫 ${orderTickets.length} ใบ</div>
          </div>

          <div class="order-card-rows">
            <div class="order-info-item">
              <div class="oi-label">ชื่อผู้ซื้อ</div>
              <div class="oi-val">${esc(rep.name || '—')}</div>
            </div>
            <div class="order-info-item">
              <div class="oi-label">เบอร์โทร</div>
              <div class="oi-val">${esc(rep.phone || '—')}</div>
            </div>
            <div class="order-info-item">
              <div class="oi-label">ประเภทบัตร</div>
              <div class="oi-val">${esc(rep.type || '—')}</div>
            </div>
            <div class="order-info-item">
              <div class="oi-label">ราคารวม</div>
              <div class="oi-val">${totalAmt ? totalAmt.toLocaleString('th-TH') + ' บาท' : '—'}</div>
            </div>
            <div class="order-info-item" style="grid-column: 1 / -1;">
              <div class="oi-label">รอบแสดง</div>
              <div class="oi-val">${esc(rep.showDate || '—')}</div>
            </div>
          </div>

          ${statusPills ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">${statusPills}</div>` : ''}
        </div>

        <!-- Expand button -->
        <div class="order-card-footer">
          <button class="btn-expand-tickets" id="expand-btn-${orderIdx}"
                  onclick="toggleTickets(${orderIdx}, '${orderId}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
            </svg>
            ดูบัตร ${orderTickets.length} ใบ
            <span class="expand-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </button>
        </div>

        <!-- Tickets panel (expandable) -->
        <div class="tickets-panel" id="tickets-panel-${orderIdx}">
          <div class="tickets-panel-inner">
            <div class="tickets-panel-label">🎫 บัตรในรายการนี้ (${orderTickets.length} ใบ)</div>
            ${ticketsHtml}
          </div>
        </div>

      </div>`;
  });

  resultEl.innerHTML = html;
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ── TOGGLE TICKETS PANEL ── */
function toggleTickets(orderIdx, orderId) {
  const panel  = document.getElementById(`tickets-panel-${orderIdx}`);
  const btn    = document.getElementById(`expand-btn-${orderIdx}`);
  const isOpen = panel.classList.contains('open');

  if (isOpen) {
    panel.classList.remove('open');
    btn.classList.remove('open');
    btn.querySelector('span:last-child').innerHTML =
      `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>`;
  } else {
    panel.classList.add('open');
    btn.classList.add('open');
    btn.querySelector('span:last-child').innerHTML =
      `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>`;

    // Generate QR codes only when first opened
    if (!panel.dataset.rendered) {
      panel.dataset.rendered = '1';
      const allTickets = JSON.parse(localStorage.getItem('theater_tickets') || '{}');
      const orderTickets = Object.values(allTickets)
        .filter(t => t.orderId === orderId && !t.cancelled)
        .sort((a, b) => a.ticketNum - b.ticketNum);

      orderTickets.forEach((ticket, idx) => {
        setTimeout(() => makeQR(`qr-status-${ticket.ticketId}`, ticket.ticketId, 170), idx * 60);
      });
    }

    // Scroll to panel
    setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
  }
}

/* ── QR GENERATOR ── */
function makeQR(elementId, text, size) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.innerHTML = '';
  try {
    new QRCode(el, {
      text,
      width: size * 2,
      height: size * 2,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
    const canvas = el.querySelector('canvas');
    const img    = el.querySelector('img');
    if (canvas) { 
      canvas.style.borderRadius = '4px'; 
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
    }
    if (img) { 
      img.style.borderRadius = '4px'; 
      img.style.width = size + 'px';
      img.style.height = size + 'px';
    }
  } catch(e) {
    el.innerHTML = `<div style="width:${size}px;height:${size}px;background:#f3f4f6;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:12px">QR Error</div>`;
  }
}

/* ── DOWNLOAD QR ── */
function downloadQR(ticketId) {
  const allTickets = JSON.parse(localStorage.getItem('theater_tickets') || '{}');
  const ticket = Object.values(allTickets).find(t => t.ticketId === ticketId);
  if (!ticket) return;

  const qrEl     = document.getElementById(`qr-status-${ticketId}`);
  const qrCanvas = qrEl?.querySelector('canvas');

  const tc  = document.createElement('canvas');
  tc.width  = 400; tc.height = 540;
  const ctx = tc.getContext('2d');

  // Background: Deep dark / black
  ctx.fillStyle = '#0f0f11';
  ctx.fillRect(0, 0, tc.width, tc.height);

  // Border: Sleek graphite border
  ctx.strokeStyle = '#27272a';
  ctx.lineWidth   = 2;
  ctx.strokeRect(10, 10, tc.width - 20, tc.height - 20);

  // Top Red Accent Line
  ctx.fillStyle = '#ff3b30';
  ctx.fillRect(20, 14, tc.width - 40, 3);

  // Header Titles
  ctx.fillStyle  = '#ff3b30';
  ctx.font       = 'bold 16px sans-serif';
  ctx.textAlign  = 'center';
  ctx.fillText('RED KIREN FILE', tc.width / 2, 48);

  ctx.fillStyle  = '#ffffff';
  ctx.font       = 'bold 15px sans-serif';
  ctx.fillText('แฟ้มคดีกิเลนแดง : สังหารหมู่เขาศูนย์', tc.width / 2, 72);

  // QR Code Box (White background card for 100% scan contrast)
  if (qrCanvas) {
    const qrSize = 190;
    const boxPadding = 10;
    const boxSize = qrSize + boxPadding * 2;
    const boxX = (tc.width - boxSize) / 2;
    const boxY = 92;

    ctx.fillStyle = '#ffffff';
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxSize, boxSize, 12);
      ctx.fill();
    } else {
      ctx.fillRect(boxX, boxY, boxSize, boxSize);
    }

    ctx.drawImage(qrCanvas, (tc.width - qrSize) / 2, boxY + boxPadding, qrSize, qrSize);
  }

  // Info details
  ctx.fillStyle = '#ffffff';
  ctx.font      = 'bold 16px sans-serif';
  ctx.fillText(ticket.name || '', tc.width / 2, 340);

  ctx.fillStyle = '#d4d4d8';
  ctx.font      = '13px sans-serif';
  ctx.fillText(`ประเภท: ${ticket.type}`, tc.width / 2, 365);
  ctx.fillText(`ใบที่ ${ticket.ticketNum}`, tc.width / 2, 388);

  if (ticket.showDate) {
    ctx.fillStyle = '#ff453a';
    ctx.font      = 'bold 13px sans-serif';
    ctx.fillText(ticket.showDate, tc.width / 2, 416);
  }

  ctx.fillStyle = '#71717a';
  ctx.font      = '11px monospace';
  ctx.fillText(ticketId, tc.width / 2, 444);

  ctx.fillStyle = '#52525b';
  ctx.font      = '10px sans-serif';
  ctx.fillText('HostBBK (MRT ลุมพินี)', tc.width / 2, 470);

  const link = document.createElement('a');
  link.download = `ticket-${ticketId}.png`;
  link.href = tc.toDataURL('image/png');
  link.click();
}

function regenerateSingleQR(ticketId) {
  const allTickets = JSON.parse(localStorage.getItem('theater_tickets') || '{}');
  const ticket = Object.values(allTickets).find(t => t.ticketId === ticketId);
  if (!ticket) return;

  makeQR(`qr-status-${ticketId}`, ticketId, 170);
  showToast('🔄 สร้าง QR Code บัตรใบนี้ใหม่อีกครั้งแล้วครับ!', 'success');
}

function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className   = `toast ${type} show`;
  setTimeout(() => { toast.className = 'toast'; }, 3500);
}

/* ── ESCAPE HTML ── */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── AUTO-SEARCH from URL param ── */
document.addEventListener('DOMContentLoaded', () => {
  const params  = new URLSearchParams(window.location.search);
  const orderId = params.get('order');
  if (orderId) {
    switchTab('order');
    document.getElementById('input-order').value = orderId;
    doSearch();
  } else {
    document.getElementById('input-phone').focus();
  }
});
</script>
